[project]
name = "neighborhoodshield"
version = "0.1.0"
description = "Self-service cybersecurity assessment for neighborhood businesses (ChiEAC CommunityWealth AI)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Gyanendhar Reddy Reddymalla" }]

[tool.setuptools]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
